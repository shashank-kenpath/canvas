[package]
name = "canvas_core"
version = "0.1.0"
edition = "2021"
description = "Canvas Studio whiteboard core: document, tools, recognition, software renderer"

[dependencies]
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
