# Builds Inkboard for macOS (universal), Windows, Linux, Android and the web.
# Every run keeps the files as workflow artifacts. On main, when the version
# in rust/desktop/Cargo.toml has no release yet, it publishes GitHub release
# v<version> with stable file names, which whiteboard.kenpathlabs.com links to
# through /releases/latest/download/<name>.
name: Apps and releases

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo test -p canvas_core --lib
      - name: Build Apple Silicon and Intel
        run: |
          cargo build --release -p inkboard_desktop --target aarch64-apple-darwin
          cargo build --release -p inkboard_desktop --target x86_64-apple-darwin
      - name: Package Inkboard.app and dmg
        run: |
          app=out/Inkboard.app/Contents
          mkdir -p $app/MacOS $app/Resources
          lipo -create -output $app/MacOS/Inkboard \
            target/aarch64-apple-darwin/release/inkboard target/x86_64-apple-darwin/release/inkboard
          # App icon from the brand logo.
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s ../branding/logo.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) ../branding/logo.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o $app/Resources/Inkboard.icns
          version=$(grep '^version' desktop/Cargo.toml | head -1 | cut -d'"' -f2)
          cat > $app/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Inkboard</string>
            <key>CFBundleDisplayName</key><string>Inkboard</string>
            <key>CFBundleIdentifier</key><string>com.kenpathlabs.inkboard</string>
            <key>CFBundleExecutable</key><string>Inkboard</string>
            <key>CFBundleIconFile</key><string>Inkboard</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Ad-hoc signature so it runs on Apple Silicon; notarise for silent installs.
          codesign --force --deep --sign - out/Inkboard.app
          ln -s /Applications out/Applications
          hdiutil create -volname Inkboard -srcfolder out -ov -format UDZO Inkboard-macOS.dmg
      - uses: actions/upload-artifact@v4
        with: { name: Inkboard-macOS, path: rust/Inkboard-macOS.dmg }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo test -p canvas_core --lib
      - run: cargo build --release -p inkboard_desktop
      - run: Copy-Item target/release/inkboard.exe Inkboard-Windows-x64.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: Inkboard-Windows, path: rust/Inkboard-Windows-x64.exe }

  linux:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo test -p canvas_core --lib
      - run: cargo build --release -p inkboard_desktop
      - run: tar -C target/release -czf Inkboard-Linux-x64.tar.gz inkboard
      - uses: actions/upload-artifact@v4
        with: { name: Inkboard-Linux, path: rust/Inkboard-Linux-x64.tar.gz }

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' rust/Cargo.lock | grep version | cut -d'"' -f2)"
      - run: bash rust/web/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: Inkboard-Web, path: cloud/public/app }

  android:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # The runner image ships the Android SDK in $ANDROID_HOME; add the NDK and API 36.
      - name: Android NDK
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo install cargo-ndk --locked
      - name: Release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        working-directory: rust/app-android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash rust/app-android/build.sh
          cp rust/out/canvas-studio-rust.apk Inkboard-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: Inkboard-Android, path: Inkboard-Android.apk }

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          version=$(grep '^version' rust/desktop/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; bump rust/desktop/Cargo.toml to publish a new one."
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists != 'true'
        with: { path: dist, pattern: "Inkboard-*", merge-multiple: true }
      # Only the installable apps go in the release; the web build is deployed to the Worker.
      - if: steps.v.outputs.exists != 'true'
        run: find dist -mindepth 1 -not -name 'Inkboard-*' -delete && ls -la dist
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists != 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Inkboard ${{ steps.v.outputs.version }}
          make_latest: true
          files: dist/*
          body: |
            Download from **https://whiteboard.kenpathlabs.com**, or pick a file below.

            | | |
            |---|---|
            | macOS (Apple Silicon and Intel) | `Inkboard-macOS.dmg` |
            | Windows 10/11 | `Inkboard-Windows-x64.exe` |
            | Android 7+ (panels, tablets, phones) | `Inkboard-Android.apk` |
            | Linux x64 | `Inkboard-Linux-x64.tar.gz` |

            Sign in with your Kenpath Google account inside the app.

            The macOS app isn't notarised yet: the first time, right-click Inkboard in Applications and choose **Open**. Windows may show SmartScreen: **More info → Run anyway**.
