# Builds the Inkboard desktop app (rust/desktop) for macOS, Windows and Linux.
# Artifacts are attached to the run; tagged `desktop-v*` pushes also make a release.
name: Desktop apps

on:
  push:
    branches: [main, cloud-collab]
    tags: ["desktop-v*"]
    paths: ["rust/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["rust/**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: Inkboard-macOS-AppleSilicon
          - os: macos-13
            target: x86_64-apple-darwin
            name: Inkboard-macOS-Intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Inkboard-Windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Inkboard-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Core tests
        run: cargo test -p canvas_core --lib
      - name: Build
        run: cargo build --release -p inkboard_desktop --target ${{ matrix.target }}
      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          app=out/Inkboard.app/Contents
          mkdir -p $app/MacOS $app/Resources
          cp target/${{ matrix.target }}/release/inkboard $app/MacOS/Inkboard
          version=$(grep '^version' desktop/Cargo.toml | head -1 | cut -d'"' -f2)
          cat > $app/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Inkboard</string>
            <key>CFBundleDisplayName</key><string>Inkboard</string>
            <key>CFBundleIdentifier</key><string>com.canvasstudio.inkboard</string>
            <key>CFBundleExecutable</key><string>Inkboard</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Ad-hoc signature so Apple Silicon will run it; notarise for distribution.
          codesign --force --deep --sign - out/Inkboard.app
          cd out && ditto -c -k --keepParent Inkboard.app ../${{ matrix.name }}.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/inkboard.exe -DestinationPath ${{ matrix.name }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.name }}.tar.gz inkboard
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: rust/${{ matrix.name }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          files: rust/${{ matrix.name }}.*
